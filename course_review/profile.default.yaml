# Package profile: everything that is a convention of the course package rather than a
# checklist rule. The checklist workbook stays the source of rule wording and thresholds
# that it states (counts, sizes, fonts). This file only says how to recognise things.

# First match wins. `pattern` is a case-insensitive regex tried on the file name (no extension).
# `scope` says which checklist scope the document answers. File names are only a hint:
# a file is bound to a checklist sheet by the scope the workbook gives that sheet.
doc_types:
  - {type: video_storyboard, pattern: 'story\s*board', ext: [docx]}
  - {type: lesson_plan, pattern: 'lesson[-_ ]*plan', ext: [docx], scope: lesson}
  - {type: facilitator_guide, pattern: 'facilitator[-_ ]*guide|lesson[-_ ]*slides', ext: [pptx], scope: lesson}
  - {type: pop_quiz, pattern: 'pop[-_ ]*quiz', ext: [docx], scope: subject}
  - {type: data_bank, pattern: 'data[-_ ]*bank', ext: [docx], scope: subject}
  - {type: specification, pattern: 'specification', ext: [docx], scope: subject}
  # Workbook: Chapter Exam is per lesson, Worksheet is per chapter.
  # The per-lesson assessment: the team calls it Assessment, the guidelines call it Worksheet.
  - {type: chapter_exam, pattern: 'assessment|worksheet', ext: [docx], scope: lesson}
  - type: worksheet
    pattern: 'chapter[-_ ]*exam'
    ext: [docx]
    scope: chapter
    note: "File name says 'Chapter Exam' but it is per chapter, which the workbook defines as a Worksheet."
  - {type: textbook, pattern: 'book', ext: [pdf]}

path_patterns:
  chapter: '(?i)(?:chapter|chpater|chapt\w*)[-_ ]*(\d+)'
  lesson: '(?i)lesson[-_ ]*(\d+)'

# Document types the Writing & Editing Guidelines apply to (subject-level WE rules).
formatted_types: [lesson_plan, facilitator_guide, video_storyboard, pop_quiz, data_bank, specification, chapter_exam, worksheet]

# Words that identify the five mandatory Lesson Plan sections (LP3, WE14), per language.
lesson_plan_sections:
  - key: introduction
    labels: ["Introduction", "تعارف"]
  - key: slos
    labels: ["SLOs", "Student Learning Outcomes", "Learning Outcomes", "حاصلات تعلیم"]
  - key: warm_up
    labels: ["Warm-up", "Warm up", "Warmup", "تحریکی سرگرمی"]
  - key: concept_building
    labels: ["Concept Building", "تصوراتی تعمیر"]
  - key: key_takeaways
    labels: ["Key Takeaways", "حاصل کلام"]

# Vocabulary used to recognise things inside question documents.
vocab:
  question_prefixes: ["question", "q", "سوال", "سوال نمبر"]
  lesson_heading_prefixes: ["lesson", "سبق"]
  chapter_ordinals:           # for headings like "باب دوم"
    1: ["اول", "first", "one"]
    2: ["دوم", "second", "two"]
    3: ["سوم", "third", "three"]
    4: ["چہارم", "fourth", "four"]
    5: ["پنجم", "fifth", "five"]
    6: ["ششم", "sixth", "six"]
    7: ["ہفتم", "seventh", "seven"]
    8: ["ہشتم", "eighth", "eight"]
    9: ["نہم", "ninth", "nine"]
    10: ["دہم", "tenth", "ten"]
  variant_letters: {"الف": "A", "ب": "B", "ج": "C", "د": "D"}
  question_region_end_labels: ["اساتذہ", "Teacher", "Facilitator", "رہنمائے", "تشخیصی رہنمائی", "Answer Key", "Marking guide", "جوابات", "Guidance"]
  # extra slide names for the Lesson Plan sections in a Facilitator's Guide (FG7): the guide's own
  # structure is Cover / Session Overview / Introduction / Warm-up / Concept Building / Recap / Close
  fg_section_labels:
    slos: ["Session Overview", "Lesson SLOs", "Lesson at a glance", "سیشن کا جائزہ", "سیشن کا خلاصہ", "سبق پر ایک نظر"]
    key_takeaways: ["Recap", "Summary", "خلاصہ", "اعادہ"]
  # lines that are notes or instructions, never the start of a Lesson Plan section
  note_labels: ["Tip", "Remember", "Instructions for", "General instructions", "طلبہ کے لیے", "برائے طلبہ", "عمومی ہدایات", "ہدایت برائے"]
  # headings after the five sections that the templates leave unnumbered
  appendix_headings: ["Book and SLO Coverage", "Book & SLO Coverage", "کتاب اور SLO", "کتاب اور حاصلات", "References", "Reference List", "حوالہ جات"]
  facilitator_note_labels: ["Facilitator Notes", "Facilitator Note", "Facilitator tip", "Teacher note",
                            "مقرر کے لیے نوٹ", "مقرر کے لیے مشورہ"]
  reference_list_labels: ["References", "Reference List", "Bibliography", "حوالہ جات"]
  slo_tag_patterns: ['\bSLO\b', 'حاصلات? ?تعلیم', '[A-Z]-\d{2}-[A-Z]-\d{2}']
  lesson_plan_location_labels: ["Lesson Plan Location", "سبق کے منصوبے میں مقام"]     # Pop Quiz template, English and Urdu
  feedback_labels: ["Correct feedback", "Incorrect feedback", "درست فیڈبیک", "غلط فیڈبیک"]
  answer_key_labels: ["Answer Key", "Answers", "جوابات", "جواب نامہ", "کلید جوابات"]
  # sub-labels inside an SLO section (Knowledge / Skills / Attitude); they do not end the SLO list
  slo_sublabels: ["Knowledge", "Skills", "Skill", "Attitude", "Values", "علم", "صلاحیت", "صلاحیتیں", "رویہ", "رویے", "اقدار"]
  # sentences that introduce the SLO list rather than being an SLO
  slo_lead_ins: ["By the end", "At the end", "Students will be able to", "اس سبق کے اختتام", "سبق کے اختتام پر", "اس سبق کو پڑھنے کے بعد", "اس سبق کو پڑھن"]
  # lines that end an SLO list: instructions and notes that follow it
  slo_block_end_labels: ["Note", "Notes", "Instruction", "Instructions", "For teachers", "Teacher", "نوٹ", "ہدایت", "ہدایات",
                         "برائے اساتذہ", "اساتذہ کے لیے", "طلبہ کے لیے"]
  # lines that start with these are labels inside a question (answer, hint), never section headings
  answer_line_labels: ["Answer", "Model answer", "Sample answer", "Hint", "مثالی جواب", "جواب", "اشارہ"]
  caption_prefixes:
    table: ["Table", "جدول"]
    figure: ["Figure", "Fig.", "شکل"]
  mcq_types: ["کثیر الانتخابی سوال", "MCQ", "Multiple choice", "Multiple choice question"]
  data_bank_fields:
    chapter_lesson: ["باب / سبق", "Chapter / Lesson"]
    subject: ["مضمون", "Subject"]
    chapter: ["باب", "Chapter"]
    lesson: ["سبق", "Lesson"]
    slo: ["حاصلات تعلیم", "SLO", "SLO Code", "SLOs"]
    question_type: ["قسم سوال", "Question type", "Type"]
    level: ["سطح", "Level"]
    question: ["سوال / محرک", "Question"]
    options: ["اختیارات / تعامل کا مواد", "Options"]
    answer: ["مثالی جواب", "Answer", "Correct answer"]
    feedback_correct: ["درست جواب کا فیڈبیک", "Correct feedback"]
    feedback_incorrect: ["غلط جواب کا فیڈبیک", "Incorrect feedback"]
  # Words in a question's type label that say its order level (Bloom's), for the 70/30 and 40/60 splits.
  higher_order_words: ["higher", "analy", "evaluat", "creat", "critical", "reasoning", "تجزیہ", "تجزی", "تنقیدی", "تخلیقی",
                       "جائزہ", "فیصلہ", "اعلیٰ", "استدلال", "خود احتساب", "منصوبہ بندی"]
  lower_order_words: ["lower", "remember", "understand", "apply", "fidelity", "recall", "یاد", "فہم", "سمجھ", "اطلاق",
                      "کتابی", "معروضی", "وضاحت"]
  # Titles before a name that mean a historical or religious person, not a story character (LP7).
  honorifics: ["حضرت", "سیدنا", "امام", "Hazrat", "Prophet", "Imam"]
  honorifics_after: ["رضی", "علیہ", "صلی", "ﷺ"]
  # Workbook says "lower-order only" without defining it. Bloom's lower-order levels:
  lower_order_levels: ["یاد کرنا", "سمجھنا", "اطلاق", "Remember", "Understand", "Apply"]

# Team decisions where the Writing & Editing Guidelines and the checklist workbook disagree.
house_rules:
  # The guideline's size table names Noto Nastaliq; the team confirmed it (2026-10-06).
  urdu_fonts: ["Noto Nastaliq Urdu", "Noto Nastaliq"]
  english_fonts: ["Poppins", "Montserrat"]
  # Sizes follow the Writing & Editing Guidelines' table, which depends on the grade.
  # Grade comes from the package (folder) name, e.g. Grade-6-Islamiat.
  sizes_by_grade:
    - grades: [1, 5]
      title: 20
      section_heading: 16
      body: 14
      table_body: 14
      table_header: 16
      caption: 11
    - grades: [6, 12]
      title: 20
      section_heading: 14
      body: 12
      table_body: 12
      table_header: 14
      caption: 11
  default_grade: 6
  paragraph_space_after_pt: 8     # "8 pt after each paragraph"

# Thresholds the workbook does not state.
thresholds:
  text_size_tolerance: 0.02       # share of text allowed to deviate from a font size rule
  min_image_dpi: 150              # "high-res images" (WE19) is not quantified in the workbook
  duplicate_similarity: 0.85      # DB5 near-duplicate check
  colour_grey_tolerance: 14       # max channel spread still counted as grey
